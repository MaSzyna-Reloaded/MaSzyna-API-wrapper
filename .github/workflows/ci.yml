name: ci

# The unit tests and the release of each platform, run with the double precision Godot fetched from
# the godot-engine workflow's release. Both live in this one workflow so that the engine is checked
# for, and after a GODOT_VERSION bump built, once. Only the Linux release needs a container
# (ci/docker/linux-sdk, for an old glibc); the Windows and Android libraries are cross-compiled on
# the runner.
#
# The exported builds are published as a GitHub release: a pull request keeps one prerelease per
# branch (maszyna-reloaded-<branch>, "/" as "-") on the branch's own commit, whose files every push
# replaces, so its download links stay the same; a pushed tag on main gets a release of its own.
# The tags godot-*-double and maszyna-reloaded-* are made by CI itself.
on:
  pull_request:
  push:
    tags:
      - '**'
      - '!godot-*-double'
      - '!maszyna-reloaded-*'
  workflow_dispatch:

jobs:
  godot-engine:
    uses: ./.github/workflows/godot-engine.yml
    permissions:
      contents: write

  run-tests:
    needs: godot-engine
    runs-on: ubuntu-24.04
    # the start-up report is a comment of the pull request
    permissions:
      contents: read
      pull-requests: write
    env:
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - name: Check out the code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Fetch the double precision Godot
        run: |
          ci/fetch-godot.sh godot.linuxbsd.editor.double.x86_64
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # the addons the demo links in from the checkout (see .gitignore)
      - name: Link the addons
        run: |
          ln -s ../../vendor/gut/addons/gut demo/addons/gut
          ln -s ../../addons/libmaszyna demo/addons/libmaszyna

      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: tests

      # the tests need no old glibc, so the library is built on the runner itself; the empty
      # overrides leave out the clang-tidy database compile-debug prepares for the IDE
      - name: Build the library
        run: make compile-debug CLANG_TIDY_COMPILE_COMMANDS_FILE= CLANG_TIDY_BINDINGS_FILE=

      - name: Import the project
        run: godot-double --headless --path demo --import

      # GUT skips a test script that does not parse with only a warning and does not count it, so
      # the run fails on the engine's own message for it
      - name: Run the tests
        run: |
          godot-double --headless --path demo -s addons/gut/gut_cmdln.gd \
            -gdir=res://tests/ -gexit -gjunit_xml_file=res://test_results.xml 2>&1 | tee gut.log
          ! grep "Failed to load script" gut.log

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gut-test-results
          path: demo/test_results.xml

      # vehicle -> OK / FAIL of its start-up test, in the run's summary (linked from the failure
      # e-mail) and in one comment of the pull request, updated by every run
      - name: Start-up report
        if: always()
        run: |
          scripts/startup-report demo/test_results.xml > startup-report.md
          cat startup-report.md >> "$GITHUB_STEP_SUMMARY"

      # a pull request from a fork has a read-only token and gets the summary only
      - name: Start-up report on the pull request
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          comment=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- startup-report -->")) | .id' | head -1)
          if [ -n "$comment" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$comment" -F body=@startup-report.md
          else
            gh api -X POST "repos/${{ github.repository }}/issues/$PR/comments" -F body=@startup-report.md
          fi

  build:
    needs: godot-engine
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            templates: godot.linuxbsd.template_release.double.x86_64
            output: bin/linux/maszyna-reloaded-linux64.zip
          - platform: windows
            templates: godot.windows.template_release.double.x86_64.exe
            output: bin/windows/maszyna-reloaded-win64.zip
          - platform: android
            templates: android_release.apk
            output: bin/android/maszyna-reloaded-android-arm64.apk
    runs-on: ubuntu-24.04
    env:
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      # a pull request is built from its branch's own commit, not from GitHub's merge with main
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive

      - name: Fetch the double precision Godot
        run: |
          ci/fetch-godot.sh godot.linuxbsd.editor.double.x86_64 ${{ matrix.templates }}
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # the addon the demo links in from the checkout (see .gitignore)
      - name: Link the addon
        run: ln -s ../../addons/libmaszyna demo/addons/libmaszyna

      - name: Install MinGW
        if: matrix.platform == 'windows'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-mingw-w64-x86-64
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix

      - uses: actions/setup-java@v6
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: 17

      # a throwaway key: this build is for testing, a published APK is signed elsewhere
      - name: Create the release keystore
        if: matrix.platform == 'android'
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/release.keystore" -alias maszyna \
            -storepass maszyna -keypass maszyna -keyalg RSA -validity 1 -dname CN=maszyna
          {
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$RUNNER_TEMP/release.keystore"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=maszyna"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=maszyna"
          } >> "$GITHUB_ENV"

      # every export builds the debug library on the runner first (compile-debug, for the exporting
      # editor), through ccache; the Linux release library is built in the SDK container, which
      # gets none of this environment
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.platform }}

      - name: Build and export ${{ matrix.platform }}
        run: make release-${{ matrix.platform }}

      - uses: actions/upload-artifact@v7
        with:
          name: maszyna-reloaded-${{ matrix.platform }}
          path: ${{ matrix.output }}
          if-no-files-found: error

  publish:
    needs: build
    # a pull request from a fork gets a read-only token, so it keeps only the artifacts
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: publish-${{ github.ref }}
    steps:
      # one directory per artifact, maszyna-reloaded-<platform>
      - uses: actions/download-artifact@v8
        with:
          pattern: maszyna-reloaded-*
          path: artifacts

      # each file is published as maszyna-reloaded-<tag or branch>-<platform>.<ext>
      - name: Name the files
        env:
          NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          mkdir release
          for file in artifacts/maszyna-reloaded-*/*; do
            platform=${file#artifacts/maszyna-reloaded-}
            mv "$file" "release/maszyna-reloaded-${NAME//\//-}-${platform%%/*}.${file##*.}"
          done

      - name: Publish the branch prerelease
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          tag="maszyna-reloaded-${BRANCH//\//-}"
          # the tag is moved to the commit just built: the old release goes with its tag
          gh release delete "$tag" --cleanup-tag --yes || true
          gh release create "$tag" release/* --prerelease --target "$HEAD_SHA" \
            --title "$tag" --notes "Build of $HEAD_SHA (#${{ github.event.number }})"

      - name: Publish the tag release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # only a tag on main is released: main has to contain the tagged commit
          status=$(gh api "repos/$GH_REPO/compare/main...$GITHUB_SHA" --jq .status)
          if [ "$status" != identical ] && [ "$status" != behind ]; then
            echo "::error::$TAG is not on main" >&2
            exit 1
          fi
          # a rerun finds the release already there and only replaces its files
          gh release create "$TAG" --verify-tag --title "maszyna-reloaded-$TAG" --generate-notes \
            || gh release view "$TAG" > /dev/null
          gh release upload "$TAG" release/* --clobber
