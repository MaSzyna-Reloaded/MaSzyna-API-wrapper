name: docker-build

# DoS's double-precision images (docker-compose.yml, ci/docker/entrypoint.sh) build the library
# once per kind: the host library (template_debug) that Godot needs to import, test and export the
# project is built by build-host and handed to the unit tests and to every platform's release
# build, which compiles only its own template_release library and exports the game. The games are
# published as the branch's prerelease.
on:
  pull_request:
  workflow_dispatch:

jobs:
  build-host:
    runs-on: ubuntu-24.04
    outputs:
      build_number: ${{ steps.build-number.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/cache/restore@v6
        id: cache-restore
        with:
          path: |
            godot-cpp/
            build-api/
            build-host/
          key: template_debug-host-godot-cpp
          restore-keys: |
            template_debug-host-

      # the build number of the whole run, stamped once (cmake/write_build_number.cmake): every
      # platform's game and the installer carry the same one
      - name: Build number
        id: build-number
        run: |
          make build-number
          echo "value=$(cat demo/build_number.txt)" >> "$GITHUB_OUTPUT"

      - name: Docker build the host library
        run: sudo chmod 777 ci/docker/entrypoint.sh |
          docker compose run -e HOST_ONLY=true unit_tests

      - uses: actions/upload-artifact@v7
        with:
          name: host-library
          path: demo/bin/libmaszyna/linux/libmaszyna.debug.64.so
          if-no-files-found: error

      - uses: actions/cache/save@v6
        if: always() && steps.cache-restore.outputs.cache-hit != 'true'
        with:
          path: |
            godot-cpp/
            build-api/
            build-host/
          key: template_debug-host-godot-cpp

  run-tests:
    needs: build-host
    runs-on: ubuntu-24.04
    # the start-up report is a comment of the pull request
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # the addons the demo links in from the checkout (see .gitignore) - CMake links them when it
      # configures a build, and the tests build nothing
      - name: Link the addons
        run: |
          ln -s ../../vendor/gut/addons/gut demo/addons/gut
          ln -s ../../addons/libmaszyna demo/addons/libmaszyna

      - uses: actions/download-artifact@v8
        with:
          name: host-library
          path: demo/bin/libmaszyna/linux

      - name: Run tests
        run: sudo chmod 777 ci/docker/entrypoint.sh |
          docker compose run -e HOST_PREBUILT=true unit_tests

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gut-test-results
          path: demo/test_results.xml

      # vehicle -> OK / FAIL of its start-up test, in the run's summary and in one comment of the
      # pull request, updated by every run
      - name: Start-up report
        if: always()
        run: |
          scripts/startup-report demo/test_results.xml > startup-report.md
          cat startup-report.md >> "$GITHUB_STEP_SUMMARY"

      # a pull request from a fork has a read-only token and gets the summary only
      - name: Start-up report on the pull request
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          comment=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- startup-report -->")) | .id' | head -1)
          if [ -n "$comment" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$comment" -F body=@startup-report.md
          else
            gh api -X POST "repos/${{ github.repository }}/issues/$PR/comments" -F body=@startup-report.md
          fi

  build:
    needs: build-host
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            arch: x86_64
          - platform: linux
            arch: x86_64
          - platform: android
            arch: x86_64
          - platform: android
            arch: arm64
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/cache/restore@v6
        id: cache-restore
        with:
          path: |
            godot-cpp/
            build-api/
            build-${{ matrix.platform == 'windows' && 'win64' || format('{0}64', matrix.platform) }}/
          key: template_release-${{ matrix.platform }}-${{ matrix.arch }}-godot-cpp
          restore-keys: |
            template_release-${{ matrix.platform }}-${{ matrix.arch }}-godot-
            template_release-${{ matrix.platform }}-

      - uses: actions/download-artifact@v8
        with:
          name: host-library
          path: demo/bin/libmaszyna/linux

      # the build number the game shows and the installer carries, the one build-host stamped
      - name: Build number
        env:
          BUILD_NUMBER: ${{ needs.build-host.outputs.build_number }}
        run: printf '%s' "$BUILD_NUMBER" > demo/build_number.txt

      # a throwaway key: a release APK has to be signed, and this build is for testing - a published
      # APK is signed elsewhere; it lies in the checkout, which the container mounts as /var/maszyna
      - name: Create the release keystore
        if: matrix.platform == 'android'
        run: |
          keytool -genkeypair -keystore release.keystore -alias maszyna \
            -storepass maszyna -keypass maszyna -keyalg RSA -validity 1 -dname CN=maszyna
          {
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=/var/maszyna/release.keystore"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=maszyna"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=maszyna"
          } >> "$GITHUB_ENV"

      # docker-compose.yml reads the target from $TARGET (-t $TARGET); the keystore's variables go
      # into the container as they are (empty for the other platforms)
      - name: Docker build ${{ matrix.platform }} ${{ matrix.arch }}
        env:
          TARGET: template_release
        run: sudo chmod 777 ci/docker/entrypoint.sh |
          docker compose run -e HOST_PREBUILT=true -e GODOT_ANDROID_KEYSTORE_RELEASE_PATH
            -e GODOT_ANDROID_KEYSTORE_RELEASE_USER -e GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD
            ${{ matrix.platform }}_${{ matrix.arch }}

      # the installer of the exported game (ci/windows/maszyna-reloaded.nsi), made as release-windows
      # makes it: the export's exe under the name the installer gives it, its library beside it
      - name: Windows installer
        if: matrix.platform == 'windows'
        run: |
          # build/ is the container's (root's), the runner writes beside it
          mkdir -p installer setup
          cp build/windows/reloaded_windows_x86_64.exe installer/reloaded.exe
          cp build/windows/libmaszyna.64.dll installer/
          make windows-installer-image
          docker run --rm -v "$PWD:$PWD" -w "$PWD" maszyna-windows-installer \
            makensis -V2 -DSOURCE_DIR="$PWD/installer" -DBUILD_NUMBER="$(cat demo/build_number.txt)" \
              -DOUTFILE="$PWD/setup/maszyna-reloaded-win64-setup.exe" ci/windows/maszyna-reloaded.nsi

      - uses: actions/upload-artifact@v7
        if: matrix.platform == 'windows'
        with:
          name: installer-windows-template_release-${{ matrix.arch }}
          path: setup/maszyna-reloaded-win64-setup.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: lib-${{ matrix.platform }}-template_release-${{ matrix.arch }}
          path: demo/bin/libmaszyna/${{ matrix.platform }}

      - uses: actions/upload-artifact@v7
        with:
          name: game-${{ matrix.platform }}-template_release-${{ matrix.arch }}
          path: build/${{ matrix.platform }}

      - uses: actions/cache/save@v6
        if: always() && steps.cache-restore.outputs.cache-hit != 'true'
        with:
          path: |
            godot-cpp/
            build-api/
            build-${{ matrix.platform == 'windows' && 'win64' || format('{0}64', matrix.platform) }}/
          key: template_release-${{ matrix.platform }}-${{ matrix.arch }}-godot-cpp

  # The games the builds exported (game-<platform>-<target>-<arch>), published as the branch's
  # prerelease (maszyna-reloaded-<branch>, "/" as "-") on its own commit, whose files every push
  # replaces with the latest build's, named with its build number; nothing is built again here. A
  # pull request from a fork has a read-only token and keeps only the artifacts.
  publish:
    needs: [build-host, build]
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: publish-${{ github.ref }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: game-*
          path: artifacts

      - uses: actions/download-artifact@v8
        with:
          pattern: installer-*
          path: installers

      # each game as maszyna-reloaded-<branch>-<build>-<platform>-<target>-<arch>.zip, an APK as it
      # is, the Windows installer as maszyna-reloaded-<branch>-<build>-windows-setup.exe
      - name: Name the files
        env:
          NAME: ${{ github.head_ref }}
          BUILD_NUMBER: ${{ needs.build-host.outputs.build_number }}
        run: |
          mkdir release
          prefix="maszyna-reloaded-${NAME//\//-}-$BUILD_NUMBER"
          for dir in artifacts/game-*; do
            file="$PWD/release/$prefix-${dir#artifacts/game-}"
            if ls "$dir"/*.apk > /dev/null 2>&1; then
              cp "$dir"/*.apk "$file.apk"
            else
              (cd "$dir" && zip -qr "$file.zip" .)
            fi
          done
          # one artifact is unpacked straight into installers/, several each into its own directory
          find installers -name maszyna-reloaded-win64-setup.exe \
            -exec cp {} "release/$prefix-windows-setup.exe" \;
          test -f "release/$prefix-windows-setup.exe"
          ls -l release

      - name: Publish the branch prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BUILD_NUMBER: ${{ needs.build-host.outputs.build_number }}
        run: |
          tag="maszyna-reloaded-${BRANCH//\//-}"
          # the tag is moved to the commit just built: the old release goes with its tag
          gh release delete "$tag" --cleanup-tag --yes || true
          gh release create "$tag" release/* --prerelease --target "$HEAD_SHA" \
            --title "$tag" --notes "Build $BUILD_NUMBER of $HEAD_SHA (#${{ github.event.number }})"
